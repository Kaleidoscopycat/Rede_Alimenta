# Taxonomia de categorias, perecibilidade e nomes de produto — v0.2 (PREMISSA DO PROJETO; não é dado de fonte).
# Fonte de cada campo: ver DATA_SIMULATION_SPEC.md §3.2. Âncoras citadas (Anvisa, MDS, Conab) LIMITAM mas não determinam os intervalos.
# product_name_origin ∈ {MDS_CATALOGO_2018, CONAB_COMPENDIO_2021, MESA_BRASIL_SESC, SEDUC_GO_2024, PREMISSA_PROJETO}.
# NUNCA "PAA" nem "TACO". nova_group = premissa de mapeamento (guia NOVA não lido; usado só na calibração R2).
# unit_mass_kg = massa unitária (PREMISSA, sem fonte): liga o texto ao quantidade_kg.
version: "0.2"
perecibilidade_classes: [NAO_PERECIVEL, PERECIVEL_BAIXO_RISCO, PERECIVEL_REFRIGERADO_CONGELADO, PRONTO_ALTO_RISCO]
categories:
  HORT_FOLHOSAS:
    desc: folhosas, talos, inflorescências (MDS grupo A)
    perecibilidade: PERECIVEL_BAIXO_RISCO
    p_refrigeracao: 0.6          # "recomendada" (premissa)
    days: [1, 4]
    anchor: "G6: folhas desinfetadas 12 h (contexto de cozinha escolar; só qualitativo)"
    unit_mass_kg: {kg: 1.0, caixa: 10.0, unidade: 0.4, bandeja: 0.5}
    unit_probs: {kg: 0.35, caixa: 0.4, unidade: 0.15, bandeja: 0.10}
    products:
      - {name: acelga, origin: MDS_CATALOGO_2018, nova: 1}
      - {name: alface, origin: PREMISSA_PROJETO, nova: 1}
      - {name: couve, origin: PREMISSA_PROJETO, nova: 1}
      - {name: espinafre, origin: PREMISSA_PROJETO, nova: 1}
